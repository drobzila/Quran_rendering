name: Quran Daily Scheduler

on:
  # 06:17 Algeria time (UTC+1), deliberately away from the top of the hour.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: quran-daily-scheduler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config python3-dev fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check rendering dependencies
        run: python -c "import numpy, PIL, manim; print('NumPy:', numpy.__version__); print('Pillow:', PIL.__version__); print('Manim:', manim.__version__)"

      - name: Register font
        run: |
          mkdir -p ~/.fonts
          cp Amiri-Regular.ttf ~/.fonts/
          fc-cache -fv

      - name: Restore credentials
        run: |
          printf '%s' '${{ secrets.CLIENT_SECRET }}' > client_secret.json
          printf '%s' '${{ secrets.YT_TOKEN }}' | base64 -d > token.pkl

      - name: Calculate four publishing times
        id: times
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os
          DZ = timezone(timedelta(hours=1))
          now = datetime.now(timezone.utc).astimezone(DZ)
          slots = [(10, 0), (14, 0), (18, 0), (21, 0)]
          candidates = []
          for offset in range(0, 3):
              day = (now + timedelta(days=offset)).date()
              for h, m in slots:
                  dt = datetime(day.year, day.month, day.day, h, m, tzinfo=DZ)
                  if dt > now:
                      candidates.append(dt)
              if len(candidates) >= 4:
                  break
          if len(candidates) < 4:
              raise RuntimeError("Could not calculate four future publishing slots")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for i, dt in enumerate(candidates[:4], 1):
                  utc = dt.astimezone(timezone.utc)
                  f.write(f"publish{i}={utc.strftime('%Y-%m-%dT%H:%M:%SZ')}\n")
                  f.write(f"local{i}={dt.strftime('%Y-%m-%d %H:%M')}\n")
          print("Algeria time now:", now.isoformat())
          for dt in candidates[:4]:
              print("Publishing:", dt.isoformat())
          PY

      - name: Render four videos
        env:
          RENDER_COUNT: "4"
        run: |
          rm -rf media
          rm -f audio_*.mp3 selected_audio.txt selected_ayah.json title.txt youtube_url.txt Quran_Shorts_*.mp4 title_*.txt
          python Quran.py

      - name: Upload and schedule video 1
        env:
          VIDEO_FILE: Quran_Shorts_1.mp4
          TITLE_FILE: title_1.txt
          PUBLISH_AT: ${{ steps.times.outputs.publish1 }}
        run: python upload.py

      - name: Notify Telegram video 1
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_AT: ${{ steps.times.outputs.publish1 }}
          PUBLISH_LOCAL: ${{ steps.times.outputs.local1 }}
          TITLE_FILE: title_1.txt
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token, chat = os.environ.get("BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat: print("Telegram secrets missing; skipping"); raise SystemExit(0)
          title = open(os.environ["TITLE_FILE"], encoding="utf-8").read().strip()
          url = open("youtube_url.txt", encoding="utf-8").read().strip() if os.path.exists("youtube_url.txt") else ""
          msg = "🌿 نسمات القرآن\n━━━━━━━━━━━━━━━━━━\n✨ تمت جدولة تلاوة قرآنية جديدة!\n\n🎬 " + title + "\n\n📅 موعد النشر بتوقيت الجزائر: " + os.environ["PUBLISH_LOCAL"] + "\n🌍 " + os.environ["PUBLISH_AT"] + " (UTC)\n\n🔗 " + (url or "تمت الجدولة") + "\n\n🤍 اللهم اجعل القرآن نوراً وطمأنينة\n🔔 نسمات القرآن"
          req = urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage", data=urllib.parse.urlencode({"chat_id":chat,"text":msg}).encode(), method="POST")
          with urllib.request.urlopen(req, timeout=20) as r: print("Telegram:",r.status)
          PY

      - name: Upload and schedule video 2
        env:
          VIDEO_FILE: Quran_Shorts_2.mp4
          TITLE_FILE: title_2.txt
          PUBLISH_AT: ${{ steps.times.outputs.publish2 }}
        run: python upload.py

      - name: Notify Telegram video 2
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_AT: ${{ steps.times.outputs.publish2 }}
          PUBLISH_LOCAL: ${{ steps.times.outputs.local2 }}
          TITLE_FILE: title_2.txt
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token, chat = os.environ.get("BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat: print("Telegram secrets missing; skipping"); raise SystemExit(0)
          title = open(os.environ["TITLE_FILE"], encoding="utf-8").read().strip()
          url = open("youtube_url.txt", encoding="utf-8").read().strip() if os.path.exists("youtube_url.txt") else ""
          msg = "🌿 نسمات القرآن\n━━━━━━━━━━━━━━━━━━\n✨ تمت جدولة تلاوة قرآنية جديدة!\n\n🎬 " + title + "\n\n📅 موعد النشر بتوقيت الجزائر: " + os.environ["PUBLISH_LOCAL"] + "\n🌍 " + os.environ["PUBLISH_AT"] + " (UTC)\n\n🔗 " + (url or "تمت الجدولة") + "\n\n🤍 اللهم اجعل القرآن نوراً وطمأنينة\n🔔 نسمات القرآن"
          req = urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage", data=urllib.parse.urlencode({"chat_id":chat,"text":msg}).encode(), method="POST")
          with urllib.request.urlopen(req, timeout=20) as r: print("Telegram:",r.status)
          PY

      - name: Upload and schedule video 3
        env:
          VIDEO_FILE: Quran_Shorts_3.mp4
          TITLE_FILE: title_3.txt
          PUBLISH_AT: ${{ steps.times.outputs.publish3 }}
        run: python upload.py

      - name: Notify Telegram video 3
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_AT: ${{ steps.times.outputs.publish3 }}
          PUBLISH_LOCAL: ${{ steps.times.outputs.local3 }}
          TITLE_FILE: title_3.txt
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token, chat = os.environ.get("BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat: print("Telegram secrets missing; skipping"); raise SystemExit(0)
          title = open(os.environ["TITLE_FILE"], encoding="utf-8").read().strip()
          url = open("youtube_url.txt", encoding="utf-8").read().strip() if os.path.exists("youtube_url.txt") else ""
          msg = "🌿 نسمات القرآن\n━━━━━━━━━━━━━━━━━━\n✨ تمت جدولة تلاوة قرآنية جديدة!\n\n🎬 " + title + "\n\n📅 موعد النشر بتوقيت الجزائر: " + os.environ["PUBLISH_LOCAL"] + "\n🌍 " + os.environ["PUBLISH_AT"] + " (UTC)\n\n🔗 " + (url or "تمت الجدولة") + "\n\n🤍 اللهم اجعل القرآن نوراً وطمأنينة\n🔔 نسمات القرآن"
          req = urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage", data=urllib.parse.urlencode({"chat_id":chat,"text":msg}).encode(), method="POST")
          with urllib.request.urlopen(req, timeout=20) as r: print("Telegram:",r.status)
          PY

      - name: Upload and schedule video 4
        env:
          VIDEO_FILE: Quran_Shorts_4.mp4
          TITLE_FILE: title_4.txt
          PUBLISH_AT: ${{ steps.times.outputs.publish4 }}
        run: python upload.py

      - name: Notify Telegram video 4
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_AT: ${{ steps.times.outputs.publish4 }}
          PUBLISH_LOCAL: ${{ steps.times.outputs.local4 }}
          TITLE_FILE: title_4.txt
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request
          token, chat = os.environ.get("BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          if not token or not chat: print("Telegram secrets missing; skipping"); raise SystemExit(0)
          title = open(os.environ["TITLE_FILE"], encoding="utf-8").read().strip()
          url = open("youtube_url.txt", encoding="utf-8").read().strip() if os.path.exists("youtube_url.txt") else ""
          msg = "🌿 نسمات القرآن\n━━━━━━━━━━━━━━━━━━\n✨ تمت جدولة تلاوة قرآنية جديدة!\n\n🎬 " + title + "\n\n📅 موعد النشر بتوقيت الجزائر: " + os.environ["PUBLISH_LOCAL"] + "\n🌍 " + os.environ["PUBLISH_AT"] + " (UTC)\n\n🔗 " + (url or "تمت الجدولة") + "\n\n🤍 اللهم اجعل القرآن نوراً وطمأنينة\n🔔 نسمات القرآن"
          req = urllib.request.Request("https://api.telegram.org/bot"+token+"/sendMessage", data=urllib.parse.urlencode({"chat_id":chat,"text":msg}).encode(), method="POST")
          with urllib.request.urlopen(req, timeout=20) as r: print("Telegram:",r.status)
          PY

      - name: Commit used ayahs
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used_ayahs.json
          git diff --cached --quiet || git commit -m "Update used ayahs"
          git push

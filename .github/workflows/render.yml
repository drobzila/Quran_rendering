name: Quran Shorts Generator
on:
  schedule:
    - cron: "0 8,15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          ffmpeg \
          libcairo2-dev \
          libpango1.0-dev \
          libglib2.0-dev \
          pkg-config \
          python3-dev \
          fonts-dejavu-core

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install manim mutagen pydub requests numpy google-api-python-client google-auth google-auth-oauthlib

    - name: Register local font
      run: |
        mkdir -p ~/.fonts
        cp Amiri-Regular.ttf ~/.fonts/
        fc-cache -fv

    # ------------------- 🔐 RESTORE GOOGLE AUTH FILES -------------------
    - name: Restore client_secret.json
      run: echo '${{ secrets.CLIENT_SECRET }}' > client_secret.json

    - name: Restore token.pkl
      run: echo "${{ secrets.YT_TOKEN }}" | base64 -d > token.pkl

    # ------------------- 🎬 RUN GENERATION -------------------
    - name: Run script
      run: python Quran.py

    # ------------------- 📱 TELEGRAM NOTIFICATION -------------------
    # Telegram is informational only. If it fails, the workflow continues.
    - name: Notify Telegram
      if: success()
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python - <<'PY'
        import json
        import os
        import urllib.parse
        import urllib.request

        bot_token = os.environ.get("BOT_TOKEN", "")
        chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

        if not bot_token or not chat_id:
            print("⚠️ Telegram secrets are not configured; skipping notification.")
            raise SystemExit(0)

        try:
            with open("used_ayahs.json", "r", encoding="utf-8") as f:
                used = json.load(f)

            # Quran.py records the selected ayah in title.txt; use the latest
            # successful run's title as the main notification detail.
            title = ""
            if os.path.exists("title.txt"):
                with open("title.txt", "r", encoding="utf-8") as f:
                    title = f.read().strip()

            message = (
                "🎬 تم تصدير فيديو قرآن جديد بنجاح!\n\n"
                f"📖 الآية: {title or 'تم إنشاء الفيديو بنجاح'}\n"
                f"📁 الملف: Quran_Shorts.mp4\n"
                f"🔢 إجمالي الآيات المستخدمة: {len(used)}\n"
                f"🔗 التشغيل: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            )

            url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
            payload = urllib.parse.urlencode({
                "chat_id": chat_id,
                "text": message,
            }).encode("utf-8")

            request = urllib.request.Request(url, data=payload, method="POST")
            with urllib.request.urlopen(request, timeout=15) as response:
                if response.status != 200:
                    raise RuntimeError(f"Telegram returned HTTP {response.status}")

            print("✅ تم إرسال إشعار Telegram.")
        except Exception as exc:
            print(f"⚠️ تعذر إرسال إشعار Telegram: {exc}")
            # Telegram must never make the rendering workflow fail.
            raise SystemExit(0)
        PY

    # ------------------- 📤 UPLOAD TO YOUTUBE -------------------
    - name: Upload to YouTube
      run: python upload.py

    # ------------------- 📦 ARTIFACT -------------------
    - name: Upload video artifact
      uses: actions/upload-artifact@v7
      with:
        name: quran-short-${{ github.run_number }}
        path: Quran_Shorts.mp4
        retention-days: 1
        if-no-files-found: warn

    # ------------------- 💾 SAVE USED AYAH -------------------
    - name: Commit used ayahs
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add used_ayahs.json
        git commit -m "update used ayahs" || echo "no changes"
        git push

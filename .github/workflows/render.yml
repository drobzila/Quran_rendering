name: Quran Daily Scheduler
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          sudo apt update
          sudo apt install -y ffmpeg libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config python3-dev fonts-dejavu-core
          pip install --upgrade pip
          pip install manim mutagen pydub requests numpy google-api-python-client google-auth google-auth-oauthlib
      - run: |
          mkdir -p ~/.fonts
          cp Amiri-Regular.ttf ~/.fonts/
          fc-cache -fv
      - run: |
          echo '${{ secrets.CLIENT_SECRET ${{' > client_secret.json
          echo "${{ secrets.YT_TOKEN ${{" | base64 -d > token.pkl
      - id: times
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone.utc)
          dz = timezone(timedelta(hours=1))
          local = now.astimezone(dz)
          slots = [(14,0),(20,0)] if local.weekday() == 5 else [(12,30),(19,0)]
          values = []
          for h,m in slots:
              d = local.replace(hour=h, minute=m, second=0, microsecond=0)
              values.append(d.astimezone(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
          with open("$GITHUB_OUTPUT","a") as f:
              f.write("publish1="+values[0]+"\n")
              f.write("publish2="+values[1]+"\n")
          print(values)
          PY
      - name: Generate video 1
        env:
          OUTPUT_FILE: Quran_Shorts_1.mp4
        run: |
          rm -rf media; rm -f audio.mp3 title.txt youtube_url.txt
          python Quran.py
      - name: Schedule video 1
        env:
          VIDEO_FILE: Quran_Shorts_1.mp4
          PUBLISH_AT: ${{ steps.times.outputs.publish1 ${{
        run: python upload.py
      - name: Generate video 2
        env:
          OUTPUT_FILE: Quran_Shorts_2.mp4
        run: |
          rm -rf media; rm -f audio.mp3 title.txt youtube_url.txt
          python Quran.py
      - name: Schedule video 2
        env:
          VIDEO_FILE: Quran_Shorts_2.mp4
          PUBLISH_AT: ${{ steps.times.outputs.publish2 ${{
        run: python upload.py
      - name: Commit used ayahs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add used_ayahs.json
          git commit -m "Update used ayahs" || echo "No changes"
          git push
